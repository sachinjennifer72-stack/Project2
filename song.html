<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guess The Song 🎵</title>

<link rel="stylesheet" href="song.css">


<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

</head>


<body>


<div class="night-sky"></div>

<div class="stars"></div>


<main class="song-container">


<h1 class="song-title">

🎵 Guess The Song 🎵

</h1>


<p class="song-subtitle">

Let's see how well Dudu knows our little playlist 🤍

</p>



<div class="progress">

Song <span id="currentSong">1</span> / 9

</div>




<div class="song-card">


<h2 id="question">

Loading Song...

</h2>



<div class="options">


<button id="option1" class="song-option">

Option 1

</button>


<button id="option2" class="song-option">

Option 2

</button>


<button id="option3" class="song-option">

Option 3

</button>


</div>



<div id="feedback" class="feedback"></div>



<button id="nextBtn" class="next-btn">

Next Song →

</button>



</div>




<div id="resultBox" class="result-box">


<h2>

🎉 Music Master Unlocked 🎉

</h2>


<p>

You know our little songs too well ❤️

<br><br>

Every melody carries a memory with it 🤍

</p>



<div class="navigation">


<a href="justus.html">

← Back to Games Menu

</a>



</div>


</div>



</main>


<script src="song.js"></script>


</body>

</html>
